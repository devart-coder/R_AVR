[workspace]
members = [
    "nano",
    "blink_test",
    "main_test",
    "twi_test"
, "bmp180"]
default-members = ["main_test"]

resolver = "3"
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
[unstable]
json-target-spec = true
